name: deploy-book

# 每次推送到 main 分支（或手动触发）时，自动构建 Jupyter Book 并部署到 GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 授予 GitHub Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，避免并发冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Jupyter Book
        run: pip install jupyter-book

      - name: Build the book
        # BASE_URL 指定 GitHub Pages 上的部署路径（<用户名>.github.io/<仓库名>/）
        env:
          BASE_URL: https://katoyi120.github.io/my_note/
        run: jupyter-book build --html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
